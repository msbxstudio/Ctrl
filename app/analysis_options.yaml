# Configures static analysis, code formatting, and lint rules for the project.
#
# Run `flutter analyze` to check for diagnostics and lint violations.

analyzer:
  # Overrides the severity of specific analyzer diagnostics.
  errors:
    # Suppresses warnings for imports considered unnecessary.
    unnecessary_import: ignore

    # Suppresses warnings for BuildContext usage across asynchronous gaps.
    use_build_context_synchronously: ignore

  # Excludes generated files and platform-specific projects from analysis.
  exclude:
    - build/**
    - android/**
    - ios/**

# Applies the recommended lint rules for Flutter projects.
include: package:flutter_lints/flutter.yaml

# Configures the Dart code formatter.
formatter:
  # Preserves existing trailing commas without adding or removing them.
  trailing_commas: preserve

# Customizes lint rules inherited from flutter_lints.
linter:
  rules:
    # Prefers constructor declarations without redundant type names.
    unnecessary_type_name_in_constructor: true
